[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "learned-koopman"
version = "3.1.0"
description = "A PyTorch workbench for learned invariants and local Koopman laws in nonlinear mechanics."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joseph Crowley" }]
dependencies = [
  "matplotlib>=3.9",
  "numpy>=2.0",
  "torch>=2.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
learned-koopman = "learned_koopman.cli:main"

[project.urls]
Repository = "https://github.com/joseph-crowley/learned-koopman"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
